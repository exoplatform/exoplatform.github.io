openapi: 3.0.1
tags:
  - name: /attachments
    description: Managing attachments
  - name: /documents
    description: Managing documents
  - name: /transferRules
    description: Managing transfer rules
paths:
  /rest/jcr/{repoName}/{repoPath}:
    get:
      operationId: get
      parameters:
        - name: repoName
          in: path
          required: true
          schema:
            type: string
        - name: repoPath
          in: path
          required: true
          schema:
            pattern: .*
            type: string
        - name: Range
          in: header
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
    put:
      operationId: put
      parameters:
        - name: repoName
          in: path
          required: true
          schema:
            type: string
        - name: repoPath
          in: path
          required: true
          schema:
            pattern: .*
            type: string
        - name: lock-token
          in: header
          schema:
            type: string
        - name: If
          in: header
          schema:
            type: string
        - name: File-NodeType
          in: header
          schema:
            type: string
        - name: Content-NodeType
          in: header
          schema:
            type: string
        - name: Content-MixinTypes
          in: header
          schema:
            type: string
        - name: User-Agent
          in: header
          schema:
            type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: object
      responses:
        default:
          description: default response
          content:
            '*/*': {}
    delete:
      operationId: delete
      parameters:
        - name: repoName
          in: path
          required: true
          schema:
            type: string
        - name: repoPath
          in: path
          required: true
          schema:
            pattern: .*
            type: string
        - name: lock-token
          in: header
          schema:
            type: string
        - name: If
          in: header
          schema:
            type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
    head:
      operationId: head
      parameters:
        - name: repoName
          in: path
          required: true
          schema:
            type: string
        - name: repoPath
          in: path
          required: true
          schema:
            pattern: .*
            type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /rest/jcr/{repoName}/{path}:
    options:
      operationId: options
      parameters:
        - name: path
          in: path
          required: true
          schema:
            pattern: .*
            type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /rest/attachments/newDoc:
    post:
      tags:
        - /attachments
      summary: create new document
      description: create new document and returns a new created document
      operationId: createNewDocument
      requestBody:
        content:
          '*/*':
            schema:
              required:
                - path
                - pathDrive
              type: object
              properties:
                title:
                  type: string
                  description: title
                  default: "20"
                path:
                  type: string
                  description: path of new document
                pathDrive:
                  type: string
                  description: New destination path's drive
                templateName:
                  type: string
                  description: template name of new document
                  default: "20"
      responses:
        "200":
          description: Request fulfilled
  /rest/attachments/{entityType}/{entityId}:
    get:
      tags:
        - /attachments
      summary: Get list of attachments linked to an entity
      description: Get the list of attachments linked to the given entity
      operationId: getAttachmentsByEntity
      parameters:
        - name: entityId
          in: path
          description: Entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: Entity type
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    put:
      tags:
        - /attachments
      summary: Update entity's attachments list
      description: Update entity's attachments list
      operationId: updateAttachmentsLinkedToContext
      parameters:
        - name: entityId
          in: path
          description: entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: entity type
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - attachmentId
              type: object
              properties:
                attachmentId:
                  type: array
                  description: list of files uuid stored in jcr attached to the provided entity
                  items:
                    type: string
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    delete:
      tags:
        - /attachments
      summary: Delete a list of attachments
      description: Delete the list of attachments linked to the given entity
      operationId: deleteAttachmentsByEntity
      parameters:
        - name: entityId
          in: path
          description: Entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: Entity type
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/attachments/{entityType}/{entityId}/{attachmentId}:
    get:
      tags:
        - /attachments
      summary: Get list of attachments linked to the given entity
      description: Get the list of attachments linked to the given entity
      operationId: getAttachmentByIdByEntity
      parameters:
        - name: attachmentId
          in: path
          description: Attachment technical identifier
          required: true
          schema:
            type: string
        - name: entityId
          in: path
          description: Entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: Entity type
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    post:
      tags:
        - /attachments
      summary: Link an attachment to an entity
      description: "Link an existing attachment to the given entity (Event, Task, Wiki,...)"
      operationId: linkAttachmentToEntity
      parameters:
        - name: entityId
          in: path
          description: entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: entity type
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          description: file uuid stored in jcr to be attached to the provided entity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    delete:
      tags:
        - /attachments
      summary: Delete an attachment linked to the given entity
      description: Delete an attachment linked to the given entity and returns the deleted attachment
      operationId: deleteEntityAttachment
      parameters:
        - name: entityId
          in: path
          description: Entity technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: entityType
          in: path
          description: Entity type
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          description: Attachment id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/attachments/downloadByPath:
    post:
      tags:
        - /attachments
      summary: Downloads a list of attachments by it paths
      description: "redirects to download URL of binary that contains the list of attachments in a Zip file if multiple, else the selected file"
      operationId: downloadActivityAttachments
      parameters:
        - name: fileName
          in: query
          description: Filename to use for download
          required: true
          schema:
            type: string
      requestBody:
        description: List of file attachments to download
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ActivityFileAttachment"
        required: true
      responses:
        "303":
          description: Request Redirect
        "400":
          description: Invalid query input
        "500":
          description: Internal server error
  /rest/attachments/{attachmentId}:
    get:
      tags:
        - /attachments
      summary: Get an attachment with its jcr uuid
      description: Get an attachment with its jcr uuid
      operationId: getAttachmentById
      parameters:
        - name: attachmentId
          in: path
          description: Attachment technical identifier
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/attachments/viewed/{nodeId}:
    patch:
      tags:
        - /attachments
      summary: Download a given document
      description: Download a given document
      operationId: markAsViewed
      parameters:
        - name: nodeId
          in: path
          description: node id
          required: true
          schema:
            type: string
        - name: viewer
          in: query
          description: viewer username
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "500":
          description: Internal server error
  /rest/attachments/{attachmentId}/move:
    post:
      tags:
        - /attachments
      summary: Move an attachment to a destination path
      description: Move an attachment to a destination path and returns empty response
      operationId: moveAttachmentToNewPath
      parameters:
        - name: attachmentId
          in: path
          description: Entity type
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - entityId
                - entityType
                - newPath
                - newPathDrive
              type: object
              properties:
                newPath:
                  type: string
                  description: New path
                newPathDrive:
                  type: string
                  description: New destination path's drive
                entityType:
                  type: string
                  description: New destination path's drive
                entityId:
                  type: integer
                  description: Entity technical identifier
                  format: int64
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/documents/folder:
    get:
      tags:
        - /documents
      summary: Gets documents by folder
      description: This returns documents by folder
      operationId: getDocumentsByFolder
      parameters:
        - name: folder
          in: query
          description: Folder from which documents to be retrieved
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
  /rest/documents/query:
    get:
      tags:
        - /documents
      summary: Gets documents by quey
      description: This returns documents by quey
      operationId: getDocumentsByQuery
      parameters:
        - name: query
          in: query
          description: Query from which documents to be retrieved
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
  /rest/documents/favorite:
    get:
      tags:
        - /documents
      summary: Gets favorite documents
      description: This returns favorite documents
      operationId: getFavoriteDocuments
      parameters:
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
  /rest/documents/shared:
    get:
      tags:
        - /documents
      summary: Gets shared documents
      description: This returns shared documents
      operationId: getSharedDocuments
      parameters:
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
  /rest/documents/view/{workspaceName}/{docId}:
    get:
      operationId: redirect
      parameters:
        - name: workspaceName
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /rest/transferRules/getTransfertRulesDocumentStatus:
    get:
      tags:
        - /transferRules
      summary: Gets the status of the transfert rules documents
      description: This returns the status of the transfert rules documents
      operationId: getTransfertRulesDocumentStatus
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error due to data encoding
  /rest/transferRules/saveDownloadDocumentStatus:
    put:
      tags:
        - /transferRules
      summary: Updates the download document status
      description: Updates the download document status.
      operationId: saveDownloadDocumentStatus
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "500":
          description: Internal server error due to data encoding
  /rest/transferRules/saveSharedDocumentStatus:
    put:
      tags:
        - /transferRules
      summary: Updates the shared document status
      description: Updates the shared document status.
      operationId: saveSharedDocumentStatus
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "500":
          description: Internal server error due to data encoding
components:
  schemas:
    HierarchicalProperty:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/HierarchicalProperty"
        name:
          type: object
          properties:
            namespaceURI:
              type: string
            localPart:
              type: string
            prefix:
              type: string
        stringName:
          type: string
        value:
          type: string
    ActivityFileAttachment:
      type: object
      properties:
        deleted:
          type: boolean
        destinationFolder:
          type: string
        docPath:
          type: string
        id:
          type: string
        inputStream:
          type: object
        lastModified:
          type: integer
          format: int64
        mimeType:
          type: string
        name:
          type: string
        repository:
          type: string
        storage:
          type: string
        uploadId:
          type: string
        workspace:
          type: string
info:
  title: ECMS REST API
  version: 7.3.x-SNAPSHOT
