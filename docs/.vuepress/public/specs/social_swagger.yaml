            type: array
            items:
              type: string
        - name: includeInheritedMemberships
          in: query
          description: "When filtering by groupId, whether to also include members inherited through nested groups"
          schema:
            type: boolean
            default: false
        - name: isDisabled
          in: query
          description: Is disabled users
          schema:
            type: boolean
            default: false
        - name: enrollmentStatus
          in: query
          description: "Enrollment status, ex: enrolled, not enrolled, no possible enrollment"
          schema:
            type: string
        - name: excludeCurrentUser
          in: query
          description: the current user will be excluded in the list
          schema:
            type: boolean
            default: false
        - name: includeUser
          in: query
          description: List of included users
          schema:
            type: array
            items:
              type: string
              default: "false"
            default: false
        - name: exportId
          in: query
          description: 'Returning the progress of a '
          schema:
            type: string
            default: "false"
        - name: export
          in: query
          description: Whether to export users or not
