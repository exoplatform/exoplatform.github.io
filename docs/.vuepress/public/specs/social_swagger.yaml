openapi: 3.0.1
tags:
  - name: /social/observers
    description: Managing observers for any type of data
  - name: richeditor/configuration
    description: Retrieves Rich Editor configurations
  - name: translations
    description: Manages User Translations of stored fields for all type of persisted entities
  - name: v1/social/activities
    description: Managing activities together with comments and likes
  - name: v1/social/attachments
    description: Managing attachments for any type of data
  - name: v1/social/groupSpaceBindings
    description: API  to manage the binding between a space and an organization group
  - name: v1/social/complementaryfilter
    description: Managing complementary filter
  - name: v1/social/favorites
    description: Managing favorites for any type of data
  - name: v1/social/identities
    description: Managing identities
  - name: v1/social/relationships
    description: Managing relationships of identities
  - name: v1/social/search
    description: Operations on search connectors
  - name: v1/social/sites
    description: Manage sites
  - name: v1/social/spaces
    description: Operations on spaces with their activities and users
  - name: v1/social/spacesMemberships
    description: Managing memberships of users in a space
  - name: v1/social/tags
    description: Managing tags for any type of data
  - name: v1/social/users
    description: "Operations on users with their activities, connections and spaces"
  - name: /account/deactivation
    description: Manage current user account deactivation request
  - name: /apiKey
    description: Manage User API Keys
  - name: /coediting
    description: Managing coedition of any object
  - name: /login
    description: Manage User action around login
  - name: /organizational-units
    description: Manage groups Organizational Unit designation
  - name: /otp
    description: Manage User API Keys
  - name: /skins
    description: Retrieve Skin Resources
  - name: /social/rest/activities/reports
    description: Reporting space-feed activities and comments for moderation
  - name: /social/rest/categories
    description: Managing Categories
  - name: /social/rest/category/links
    description: Managing Category links
  - name: /social/rest/changes-reminder
    description: Remembers the changes reminders the current user already saw
  - name: /social/rest/contentLinks
    description: Manage Content Links
  - name: /social/rest/databind
    description: Export & Import Objects
  - name: /social/rest/navigation/settings
    description: Managing Topbar and Sidebar Navigation Configuration
  - name: /social/rest/notifications/digest
    description: Managing digest mail notification settings
  - name: /social/rest/organizational-chart
    description: Manages the settings of the organizational chart applications
  - name: /social/rest/pages
    description: Searches pages by name and by the content blocks they carry
  - name: /social/rest/reactions
    description: Managing reactions on any type of content
  - name: /social/rest/space/administration
    description: Managing spaces by platform administrators
  - name: /social/rest/space/templates
    description: Managing space templates
  - name: /social/rest/timezone
    description: Keeps the timezone of the current user up to date
  - name: /social/rest/user-card/settings
    description: Manages which profile properties the user card displays
  - name: /social/rest/users
    description: Managing the spaces listed on a user profile
paths:
  /rest/social/observers/{objectType}/{objectId}:
    get:
      tags:
        - /social/observers
      summary: Retrieves all observed objects by current user
      description: Retrieves all observed objects by current user
      operationId: isObservedObject
      parameters:
        - name: objectType
          in: path
          description: "Object type: activity, comment, notes ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: "Object identifier: technical id to identify object"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
    post:
      tags:
        - /social/observers
      summary: Observe an object
      description: Observe an object
      operationId: createObserver
      parameters:
        - name: objectType
          in: path
          description: "Object type: activity, comment, notes ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: "Object identifier: technical id to identify object"
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      tags:
        - /social/observers
      summary: Deletes the observed object for current user
      description: Deletes the observed object for current user
      operationId: deleteObserver
      parameters:
        - name: objectType
          in: path
          description: "Object type: activity, comment, notes ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: "Object identifier: technical id to identify object as observed"
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "404":
          description: Not found
  /rest/social/observers:
    get:
      tags:
        - /social/observers
      summary: Retrieves all observed objects by current user
      description: Retrieves all observed objects by current user
      operationId: getObservedObjects
      parameters:
        - name: offset
          in: query
          description: Query Offset
          required: true
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Query results limit
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Request fulfilled
  /rest/richeditor/configuration:
    get:
      tags:
        - richeditor/configuration
      summary: Retrieves rich editor configuration Javascript file
      description: Returns list of tags
      operationId: getRichEditorConfiguration
      parameters:
        - name: type
          in: query
          description: Rich Editor Type
          schema:
            type: string
        - name: v
          in: query
          description: "The value of v parameter will determine whether the query should be cached by browser or not. If not set, no 'expires HTTP Header will be sent'"
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
  /rest/social/translations/{objectType}/{objectId}:
    delete:
      tags:
        - translations
      summary: 'Deletes a list of translation labels for a given Object''s field identified by its type and id '
      description: Deletes a list of translation labels for a given Object's field identified by its type and id
      operationId: deleteTranslationLabels
      parameters:
        - name: objectType
          in: path
          description: "Object type, like 'activity', 'task' ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: Object technical identifier
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/social/translations/configuration:
    get:
      tags:
        - translations
      summary: "Retrieves the translation configuration, with the default lanfuage and supported languages"
      description: "Retrieves the translation configuration, with the default lanfuage and supported languages"
      operationId: getTranslationConfiguration
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/social/translations/{objectType}/{objectId}/{fieldName}:
    get:
      tags:
        - translations
      summary: "Retrieves the list of translation labels for a given Object's field identified by its type, id and field name"
      description: "Retrieves the list of translation labels for a given Object's field identified by its type, id and field name"
      operationId: getTranslationLabels
      parameters:
        - name: objectType
          in: path
          description: "Object type, like 'activity', 'task' ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: Object technical identifier
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Object field name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    post:
      tags:
        - translations
      summary: "Saves the list of translation labels for a given Object's field identified by its type, id and field name"
      description: "Saves the list of translation labels for a given Object's field identified by its type, id and field name"
      operationId: saveTranslationLabels
      parameters:
        - name: objectType
          in: path
          description: "Object type, like 'activity', 'task' ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: Object technical identifier
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Object field name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/social/translations/configuration/defaultLanguage:
    put:
      tags:
        - translations
      summary: Saves new default language for product
      description: Saves new default language for product
      operationId: saveDefaultLanguage
      requestBody:
        content:
          '*/*':
            schema:
              required:
                - lang
              type: object
              properties:
                lang:
                  type: string
                  description: Default language to save
      responses:
        "204":
          description: Request fulfilled
  /rest/social/translations/rich/{objectType}/{objectId}/{fieldName}:
    post:
      tags:
        - translations
      summary: "Saves the list of sanitized translation labels for a given Object's field identified by its type, id and field name"
      description: "Saves the list of translation labels for a given Object's field identified by its type, id and field name"
      operationId: saveRichTranslationLabels
      parameters:
        - name: objectType
          in: path
          description: "Object type, like 'activity', 'task' ..."
          required: true
          schema:
            type: string
        - name: objectId
          in: path
          description: Object technical identifier
          required: true
          schema:
            type: string
        - name: fieldName
          in: path
          description: Object field name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/v1/social/activities/{activityId}/likes:
    get:
      tags:
        - v1/social/activities
      summary: Gets likes of a specific activity
      description: This returns a list of likes if the authenticated user has permissions to see the activity.
      operationId: getLikesOfActivity
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    post:
      tags:
        - v1/social/activities
      summary: Adds a like to a specific activity
      description: This adds the like if the authenticated user has permissions to see the activity.
      operationId: addLike
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    delete:
      tags:
        - v1/social/activities
      summary: Deletes a like of a specific user for a given activity
      description: This deletes the like of authenticated user from an activity
      operationId: deleteLike
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
  /rest/v1/social/activities/{activityId}:
    get:
      tags:
        - v1/social/activities
      summary: Gets a specific activity by id
      description: "This returns the activity in the following cases: <br/><ul><li>this is a user activity and the owner of the activity is the authenticated user or one of his connections</li><li>this is a space activity and the authenticated user is a member of the space</li><li>the authenticated user is the super user</li></ul>"
      operationId: getActivityById
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: "Asking for a full representation of a specific subresource, ex: comments or likes"
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    put:
      tags:
        - v1/social/activities
      summary: Updates a specific activity by id
      description: "This updates the activity in the following cases: <br/><ul><li>this is a user activity and the owner of the activity is the authenticated user</li><li>the authenticated user is the super user</li></ul>"
      operationId: updateActivityById
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: "Asking for a full representation of a specific subresource, ex: comments or likes"
          schema:
            type: string
      requestBody:
        description: "Activity object to be updated, ex: <br/>{<br/>\"title\" : \"My activity\"<br/>}"
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ActivityEntity"
        required: true
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    delete:
      tags:
        - v1/social/activities
      summary: Deletes a specific activity by id
      description: "This deletes the activity in the following cases: <br/><ul><li>this is a user activity and the owner of the activity is the authenticated user</li><li>the authenticated user is the super user</li></ul>"
      operationId: deleteActivityById
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: hide
          in: query
          description: Whether to just hide the activity or effectively delete it from database
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
  /rest/v1/social/activities:
    get:
      tags:
        - v1/social/activities
      summary: Gets activities of a specific user
      description: "This returns an activity in the list in the following cases: <br/><ul><li>this is a user activity and the owner of the activity isthe authenticated user or one of his connections</li><li>this is a space activity and the authenticated user is a member of the space</li></ul>"
      operationId: getActivities
      parameters:
        - name: spaceId
          in: query
          description: Space technical identifier
          schema:
            type: string
        - name: categoryId
          in: query
          description: Category id used to search associated activities
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: excludedCategoryId
          in: query
          description: Category IDs to exclude from the result
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
        - name: returnSize
          in: query
          description: Returning the number of activities or not
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          description: "Asking for a full representation of a specific subresource, ex: <em>comments</em> or <em>likes</em>"
          schema:
            type: string
        - name: showPinned
          in: query
          description: Returning the pinned activities sorted in order or not
          schema:
            type: boolean
        - name: streamType
          in: query
          description: "Activity stream type. Possible values: ALL_STREAM, USER_STREAM, USER_FAVORITE_STREAM, MANAGE_SPACES_STREAM, FAVORITE_SPACES_STREAM."
          schema:
            type: string
            enum:
              - ALL_STREAM
              - USER_STREAM
              - USER_FAVORITE_STREAM
              - MANAGE_SPACES_STREAM
              - FAVORITE_SPACES_STREAM
              - UNREAD_SPACES_STREAM
              - ANY_SPACE_ACTIVITY
              - PIN_STREAM
              - SCHEDULED_STREAM
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
    post:
      tags:
        - v1/social/activities
      summary: Posts an activity to a specific space
      description: This posts the activity if the authenticated user is a member of the space or a spaces super manager.
      operationId: postActivity
      parameters:
        - name: spaceId
          in: query
          description: Space id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: "Asking for a full representation of a specific subresource, ex: comments or likes"
          schema:
            type: string
      requestBody:
        description: Activity object to be created
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ActivityEntity"
        required: true
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
  /rest/v1/social/activities/{activityId}/comments:
    get:
      tags:
        - v1/social/activities
      summary: Gets comments of a specific activity
      description: This returns a list of comments if the authenticated user has permissions to see the activity.
      operationId: getComments
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
        - name: returnSize
          in: query
          description: Returning the number of activities or not
          schema:
            type: boolean
            default: false
        - name: sortDescending
          in: query
          description: Retrieve comments by last post time or by first post time
          schema:
            type: boolean
            default: false
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    put:
      tags:
        - v1/social/activities
      summary: Updates an existing comment
      description: This updates an existing comment if the authenticated user is poster of the comment.
      operationId: updateComment
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      requestBody:
        description: "Comment object to be posted, ex: <br/>{<br/>\"title\" : \"My comment\"<br/>}"
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CommentEntity"
        required: true
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
    post:
      tags:
        - v1/social/activities
      summary: Posts a comment on a specific activity
      description: This posts the comment if the authenticated user has permissions to see the activity.
      operationId: postComment
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      requestBody:
        description: "Comment object to be posted, ex: <br/>{<br/>\"title\" : \"My comment\"<br/>}"
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CommentEntity"
        required: true
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
  /rest/v1/social/activities/{activityId}/pins:
    post:
      tags:
        - v1/social/activities
      summary: Pin a specific activity to space stream
      description: This pins an activity to space stream if the authenticated user is a manager or a redactor of the space.
      operationId: pinActivity
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "404":
          description: Activity not found
        "500":
          description: Internal server error
    delete:
      tags:
        - v1/social/activities
      summary: Unpin a specific activity from space stream
      description: This Unpins an activity from space stream
      operationId: unpinActivity
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "404":
          description: Activity not found
        "500":
          description: Internal server error
  /rest/v1/social/activities/{activityId}/unhide:
    put:
      tags:
        - v1/social/activities
      summary: Unhides an activity to publish it in users stream
      description: This unhides the given activity to publish it in users stream if the authenticated user has edit permissions
      operationId: publishActivity
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized
  /rest/v1/social/activities/{activityId}/publish:
    put:
      tags:
        - v1/social/activities
      summary: Publishes immediately a scheduled activity
      description: "This publishes immediately a scheduled activity, cancelling its scheduling, if the authenticated user has edit permissions"
      operationId: publishScheduledActivityNow
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource if any
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized
  /rest/v1/social/activities/search:
    get:
      tags:
        - v1/social/activities
      summary: Search activities using a query
      description: This returns a list of activities found by using search term
      operationId: searchActivities
      parameters:
        - name: q
          in: query
          description: Term to search
          required: true
          schema:
            type: string
        - name: favorites
          in: query
          description: Whether to search in favorites only or not
          schema:
            type: boolean
        - name: categoryId
          in: query
          description: Category id used to search associated activities
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: tags
          in: query
          description: Tag names used to search activities
          schema:
            type: array
            items:
              type: string
        - name: spaceId
          in: query
          description: Space id used to search activities
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: sortField
          in: query
          description: Field to sort by
          schema:
            type: string
        - name: sortDirection
          in: query
          description: Sort order (asc or desc)
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
        - name: expand
          in: query
          description: Asking for a full representation of a specific subresource
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error
        "400":
          description: Invalid query input
  /rest/v1/social/activities/{activityId}/share:
    post:
      tags:
        - v1/social/activities
      summary: Shares a specific activity to specific spaces
      description: This shares the given activity to the target spaces if the authenticated user has permissions to post to the target spaces
      operationId: shareActivity
      parameters:
        - name: activityId
          in: path
          description: Activity id
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: "Asking for a full representation of a specific subresource, ex: comments or likes"
          schema:
            type: string
      requestBody:
        description: Share target spaces
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/ActivityEntity"
        required: true
      responses:
