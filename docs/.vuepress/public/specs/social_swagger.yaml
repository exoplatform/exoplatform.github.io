            type: boolean
            default: false
        - name: download
          in: query
          description: Whether to download exported users
          schema:
            type: boolean
            default: false
        - name: sortField
          in: query
          description: sort Field
          schema:
            type: string
        - name: sortDirection
          in: query
          description: sort Direction
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
