---
openapi: 3.0.1
info:
  title: Poll REST API
  version: 7.3.x-SNAPSHOT
  license:
    name: LGPL
    url: https://www.gnu.org/licenses/lgpl-3.0.en.html
tags:
  - name: /polls
    description: Managing poll
paths:
  "/poll/rest/polls":
    post:
      tags:
        - /polls
      operationId: PollRest.createPoll
      description: Create a new poll
      summary: Create a new poll
      parameters:
        - name: spaceId
          description: space identifier
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollRestEntity"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollRestEntity"
        "401":
          description: Unauthorized operation
        "50":
          description: Internal server error
      x-operation-name: createPoll
  "/poll/rest/polls/vote/{optionId}":
    post:
      tags:
        - /polls
      operationId: PollRest.vote
      description: Vote in a poll
      summary: Vote in a poll
      parameters:
        - name: optionId
          description: Poll option id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollVote"
        "400":
          description: Invalid query input
        "404":
          description: Poll option not found
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
      x-operation-name: vote
  "/poll/rest/polls/{id}":
    get:
      tags:
        - /polls
      operationId: PollRest.getPollById
      description: This gets the poll with the given id if the authenticated user is a member of the space.
      summary: Get a poll
      parameters:
        - name: id
          description: Poll id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollRestEntity"
        "400":
          description: Invalid query input
        "404":
          description: Poll not found
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
      x-operation-name: getPollById
components:
  schemas:
    ActivityFile:
      type: object
      properties:
        deleted:
          type: boolean
        destinationFolder:
          type: string
        id:
          type: string
        inputStream:
          type: string
          format: binary
        lastModified:
          type: integer
          format: int64
        mimeType:
          type: string
        name:
          type: string
        storage:
          type: string
        uploadId:
          type: string
    PollOptionRestEntity:
      type: object
      properties:
        description:
          type: string
        id:
          type: integer
          format: int64
        voted:
          type: boolean
        votes:
          type: integer
          format: int64
    PollRestEntity:
      type: object
      properties:
        creator:
          type: string
        duration:
          type: string
        endDateTime:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: "#/components/schemas/ActivityFile"
        id:
          type: integer
          format: int64
        message:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionRestEntity"
        publicationStartTime:
          type: integer
          format: int64
        question:
          type: string
    PollVote:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pollOptionId:
          type: integer
          format: int64
        voteDate:
          type: string
          format: date-time
        voterId:
          type: integer
          format: int64
servers:
  - url: /
