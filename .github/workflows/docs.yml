name: Build and Deploy
# Builds the VuePress site and publishes it as the single commit of the gh-pages branch,
# which GitHub Pages serves (docs.exoplatform.org, from docs/.vuepress/public/CNAME).
on:
  push:
    branches:
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build
        env:
          # VuePress 1 runs webpack 4, whose hashing needs the legacy OpenSSL provider on Node 17+
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to gh-pages
        working-directory: docs/.vuepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Auto deploy from Github Actions ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
