name: Update OpenAPI Specification Files

on:
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 22 * * *'  # Daily at 22:00 UTC (6PM ET)

env:
  TARGET_FOLDER: "docs/.vuepress/public/specs"
  SERVER_URL: "https://repository.exoplatform.org"
  M2_REPO_PREFIX: "service/local/artifact/maven/redirect?"

jobs:
  update-specs:
    name: Download and commit OpenAPI specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SWF_TOKEN }}
          fetch-depth: 0

      - name: Create target directory if not exists
        run: mkdir -p ${{ env.TARGET_FOLDER }}

      - name: Download OpenAPI specifications
        shell: bash
        env:
          SPEC_FILES: >-
            r=meeds-snapshots&g=io.meeds.portal&a=portal.component.portal&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.commons&a=commons-component-common&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.social&a=social-component-service&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.app-center&a=app-center-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-addons-snapshots&g=io.meeds.kudos&a=kudos-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.poll&a=poll-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.perk-store&a=perk-store-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.notes&a=notes-service&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.task&a=task-management-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.wallet&a=wallet-api&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.gamification&a=gamification-services&v=7.1.x-exo-SNAPSHOT&c=swagger&e=yaml
            r=meeds-snapshots&g=io.meeds.content&a=content-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-snapshots&g=org.exoplatform.ecms&a=ecms-core-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.addons.dlp&a=dlp-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.anti-malware&a=anti-malware-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.addons.multifactor-authentication&a=multifactor-authentication-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.addons.web-conferencing&a=web-conferencing-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.addons.onlyoffice&a=exo-onlyoffice-editor-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.addons.chat&a=chat-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-addons-snapshots&g=org.exoplatform.processes&a=processes-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-snapshots&g=org.exoplatform.documents&a=documents-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
            r=exo-snapshots&g=org.exoplatform.agenda&a=agenda-services&v=7.1.x-SNAPSHOT&c=swagger&e=yaml
        run: |
          cd ${{ env.TARGET_FOLDER }}
          echo "Downloading OpenAPI spec files..."
          
          # Read the SPEC_FILES into an array, properly handling newlines
          IFS=$'\n' read -d '' -r -a spec_files <<< "$SPEC_FILES"
          
          for item in "${spec_files[@]}"
          do
            # Skip empty lines
            if [[ -z "$item" ]]; then
              continue
            fi
            
            # Extract artifact ID for filename
            file_name=$(echo "$item" | grep -o -P '(?<=&a=).*(?=&v)')
            final_name="${file_name//./_}_swagger.yaml"
            
            echo "Downloading ${final_name}..."
            url="${{ env.SERVER_URL }}/${{ env.M2_REPO_PREFIX }}${item}"
            
            if ! curl -sSLf "$url" --output "${final_name}"; then
              echo "::error::Failed to download ${final_name} from ${url}"
              exit 1
            fi
            
            echo "✅ Successfully downloaded ${final_name}"
          done

      - name: Commit changes
        id: commit
        run: |
          git config --global user.email "exo-swf@exoplatform.com"
          git config --global user.name "eXo Software Factory"
          
          if git diff --quiet; then
            echo "::notice::No changes to commit"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            git add -A
            git commit -m "chore: Update OpenAPI specification files [skip ci]"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit.outputs.changes_detected == 'true'
        run: git push