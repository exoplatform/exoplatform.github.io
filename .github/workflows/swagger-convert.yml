name: Download and commit updated OPENAPI spec files
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron:  '0 22 * * *' # Everyday at 6PM (before CI/CD)
jobs:
  get_and_commit_swagger_export_files:
    runs-on: ubuntu-latest
    env:
      TARGET_FOLDER: "docs/.vuepress/public/specs"
      SERVER_URL: "https://repository.exoplatform.org"
      M2_REPO_PREFIX: "service/local/artifact/maven/redirect?"
      CURRENT_VERSION: "7.1.x"
      url:
           r=exo-snapshots&g=io.meeds.commons&a=commons-component-common&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-snapshots&g=io.meeds.social&a=social-component-service&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-snapshots&g=io.meeds.portal&a=portal.component.portal&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-snapshots&g=org.exoplatform.ecms&a=ecms-core-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.dlp&a=dlp-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.anti-malware&a=anti-malware-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.app-center&a=app-center-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.kudos&a=kudos-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.multifactor-authentication&a=multifactor-authentication-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.web-conferencing&a=web-conferencing-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.onlyoffice&a=exo-onlyoffice-editor-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.chat&a=chat-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.poll&a=poll-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.perk-store&a=perk-store-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.notes&a=notes-service&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.task&a=task-management-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.wallet&a=wallet-api&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=io.meeds.gamification&a=gamification-services&v=${CURRENT_VERSION}-exo-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.processes&a=processes-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-snapshots&g=org.exoplatform.documents&a=documents-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-snapshots&g=org.exoplatform.agenda&a=agenda-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
           r=exo-addons-snapshots&g=org.exoplatform.addons.news&a=news-services&v=${CURRENT_VERSION}-SNAPSHOT&c=swagger&e=yaml
    steps:
      # Check-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.SWF_TOKEN }}

      - name: Download nexus metadata
        run: |
         cd $TARGET_FOLDER
         for item in ${url}
         do
          file_name=$(echo ${item} | grep -o -P '(?<=m.).*(?=&a)')
          final_name=${file_name//./_}
         STATUSCODE=$(curl -s -L ${SERVER_URL}/${M2_REPO_PREFIX}${item} --write-out '%{http_code}' --output ${final_name}_swagger.yaml)
         if test $STATUSCODE -ne 200; then
           echo "ERROR: ${final_name}_swagger.yaml : download Error. Status code : ${STATUSCODE}"
           echo ${SERVER_URL}/${M2_REPO_PREFIX}${item} 
           echo "No files downloaded : nothing to commit"
           exit 1
         else
           echo "${final_name}_swagger.yaml download OK"
         fi
         done
         cd $GITHUB_WORKSPACE
           git status
           git config --global user.email "exo-swf@exoplatform.com"
           git config --global user.name "eXo Software Factory"
           git add -A
           git diff-index --quiet HEAD || git commit -m "Automated integration of OPENAPI spec files"
           git push
