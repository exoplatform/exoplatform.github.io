  /rest/v1/users/{id}/changePassword:
    patch:
      tags:
        - v1/users
      summary: Changes user password
      description: Changes user password
      operationId: changePassword
      parameters:
        - name: id
          in: path
          description: username to change his password
          required: true
          schema:
            type: string
      requestBody:
        content:
          '*/*':
            schema:
              required:
                - currentPassword
                - newPassword
              type: object
              properties:
                currentPassword:
                  type: string
                  description: Current user password
                newPassword:
                  type: string
                  description: New user password
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: User not authorized to call this endpoint
        "404":
          description: User not found
        "500":
          description: Internal server error
  /rest/v1/users/confirmation:
    post:
      tags:
        - v1/users
      summary: Confirms the current session with a one-time password
      description: "Validates the one-time password sent by email to the authenticated user and marks the current session as confirmed, so that the administrator actions on user accounts are applied from it. The code validates once. The confirmation proves the caller's identity only: each guarded endpoint keeps its own permission check."
      operationId: confirmSession
      requestBody:
        content:
          '*/*':
            schema:
              required:
                - otpCode
              type: object
              properties:
                otpCode:
                  type: string
                  description: One-time password received by email
      responses:
        "204":
          description: Session confirmed
        "401":
          description: "Wrong, expired, already used or throttled code: OTP_CODE_INVALID"
  /rest/v1/users:
    get:
      tags:
        - v1/users
      summary: Gets all users
      description: Gets all users
      operationId: getUsers
      parameters:
        - name: q
          in: query
          description: "User name information to filter, ex: user name, last name, first name or full name"
          schema:
            type: string
        - name: status
          in: query
          description: "User status : ANY, ENABLED or DISABLED"
          schema:
            type: string
            default: ANY
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 10
        - name: returnSize
          in: query
          description: Returning the number of users found or not
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error due to data encoding
    put:
      tags:
        - v1/users
      summary: Update an existing user
      description: "Update an existing user: names, email, password when given, enabled flag, and the preferred language when given, a blank one leaving the stored one unchanged"
      operationId: updateUser
      requestBody:
        description: User Object
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UserRestEntity"
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: "Invalid query input, or a language that is not a supported locale: LANGUAGE:INVALID"
        "404":
          description: Unknown user
        "403":
          description: "User not administrator, or the session has not been confirmed with a one-time password: OTP_REQUIRED"
        "500":
          description: "The update could not be proven: USER:PASSWORD_NOT_STORED or USER:PASSWORD_NOT_VERIFIABLE, nothing written after the password; USER:UPDATE_INCOMPLETE, a field read back other than requested"
    post:
      tags:
        - v1/users
      summary: Create new user
      description: "Creates an account: the login is the given one or a generated one, the password is optional, the role (INTERNAL, EXTERNAL or ADMINISTRATOR) decides the memberships, the language is the preferred one"
      operationId: createUser
      requestBody:
        description: User Object
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/UserRestEntity"
      responses:
        "201":
          description: "Account created, the body carries its login"
        "400":
          description: "A refused field, the body being its code: USERNAME:*, PASSWORD:*, FIRSTNAME:*, LASTNAME:*, EMAIL:*, ROLE:INVALID, LANGUAGE:INVALID"
        "403":
          description: "The session has not been confirmed with a one-time password: OTP_REQUIRED"
        "500":
          description: "The store did not complete the creation, the body being the code: USER:CREATION_FAILED and USER:USERNAME_GENERATION_EXHAUSTED (nothing created), USER:CREATED_INCOMPLETE:<login>:<parts> (created, then deactivated), USER:CREATED_INCOMPLETE_ENABLED:<login>:<parts> (created, still active)"
  /rest/v1/users/{id}:
    get:
      tags:
        - v1/users
      summary: Gets a user identified by its id
      description: Gets a user identified by its id
      operationId: getUser
      parameters:
        - name: id
          in: path
          description: User name identifier
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: User not authorized to call this endpoint
        "404":
          description: User not found
        "500":
          description: Internal server error
    delete:
      tags:
        - v1/users
      summary: Deletes a user identified by its id
      description: Deletes a user identified by its id
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          description: User name identifier
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "401":
          description: User not authorized to call this endpoint
        "403":
          description: "The session has not been confirmed with a one-time password: OTP_REQUIRED"
        "404":
          description: User not found
        "500":
          description: Internal server error
  /rest/v1/users/onboardingSettings:
    get:
      tags:
        - v1/users
      summary: Gets the onboarding settings
      description: "Gets the validity of an onboarding link, in days and in hours, as configured on the platform"
      operationId: getOnboardingSettings
      responses:
        "200":
          description: Request fulfilled
  /rest/v1/users/{id}/memberships:
    get:
      tags:
        - v1/users
      summary: Gets User memberships list
      description: Gets User memberships list
      operationId: getUserMemberships
      parameters:
        - name: id
          in: path
          description: User name identifier
          required: true
          schema:
            type: string
        - name: groupId
          in: query
          description: "Group id to filter only its memberships, ex: /platform"
          schema:
            type: string
        - name: includeNestedGroups
          in: query
          description: "When filtering by groupId, whether to also include memberships on groups nested, at any level, inside the given group"
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
        - name: returnSize
          in: query
          description: Returning the number of users found or not
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Request fulfilled
        "403":
          description: User not allowed to list the group memberships
        "404":
          description: User not found
        "500":
          description: Internal server error due to data encoding
  /rest/v1/users/isSuperUser:
    get:
      tags:
        - v1/users
      summary: Check if current user is a superUser
      description: Check if current user is a superUser
      operationId: isSuperUser
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error due to data encoding
  /rest/v1/users/isSynchronizedUserAllowedToChangePassword:
    get:
      tags:
        - v1/users
      summary: Check if synchronized user is allowed to change his password
      description: Check if synchronized user is allowed to change his password
      operationId: isSynchronizedUserAllowedToChangePassword
      responses:
        "200":
          description: Request fulfilled
        "500":
          description: Internal server error due to data encoding
components:
  schemas:
    RegistrationSetting:
      type: object
      properties:
        accountDeactivationEnabled:
          type: boolean
        accountDeletionAnonymizationEnabled:
          type: boolean
        accountDeletionEnabled:
          type: boolean
        deletedUserLabels:
          type: object
          additionalProperties:
            type: string
        externalUser:
          type: boolean
        extraGroupIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - OPEN
            - RESTRICTED
    Background:
      type: object
      properties:
        data:
          type: string
          format: byte
        fileId:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        updatedDate:
          type: integer
          format: int64
        uploadId:
          type: string
    Branding:
      type: object
      properties:
        appBackground:
          $ref: "#/components/schemas/Background"
        appTextHeaderBackground:
          $ref: "#/components/schemas/Background"
        appTextTitleBackground:
          $ref: "#/components/schemas/Background"
        companyLink:
          type: string
        companyName:
          type: string
        customCss:
          type: string
        defaultLanguage:
          type: string
        direction:
          type: string
        drawerBackground:
          $ref: "#/components/schemas/Background"
        favicon:
          $ref: "#/components/schemas/Favicon"
        lastUpdatedTime:
          type: integer
          format: int64
        loginBackground:
          $ref: "#/components/schemas/Background"
        loginBackgroundAltText:
          type: string
        loginBackgroundTextColor:
          type: string
        loginSubtitle:
          type: object
          additionalProperties:
            type: string
        loginTitle:
          type: object
          additionalProperties:
            type: string
        logo:
          $ref: "#/components/schemas/Logo"
        pageBackground:
          $ref: "#/components/schemas/Background"
        pageBackgroundAttachment:
          type: string
        pageBackgroundColor:
          type: string
        pageBackgroundEffect:
          type: string
        pageBackgroundPosition:
          type: string
        pageBackgroundRepeat:
          type: string
        pageBackgroundSize:
          type: string
        pageWidth:
          type: string
        sideBarBackground:
          $ref: "#/components/schemas/Background"
        siteName:
          type: string
        supportedFontFamilies:
          type: array
          items:
            type: string
        supportedLanguages:
          type: object
          additionalProperties:
            type: string
        themeStyle:
          type: object
          additionalProperties:
            type: string
        topBarBackground:
          $ref: "#/components/schemas/Background"
    Favicon:
      type: object
      properties:
        data:
          type: string
          format: byte
        fileId:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        updatedDate:
          type: integer
          format: int64
        uploadId:
          type: string
    Logo:
      type: object
      properties:
        data:
          type: string
          format: byte
        fileId:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        updatedDate:
          type: integer
          format: int64
        uploadId:
          type: string
    GroupImpl:
      type: object
      properties:
        description:
          type: string
        enclosingMemberships:
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/NestedMembership"
        groupName:
          type: string
        id:
          type: string
        internalStore:
          type: boolean
        label:
          type: string
        originatingStore:
          type: string
        parentId:
          type: string
    NestedMembership:
      type: object
      properties:
