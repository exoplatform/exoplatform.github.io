        enabled:
          type: boolean
        firstName:
          type: string
        fullName:
          type: string
        isInternal:
          type: boolean
        language:
          type: string
        lastName:
          type: string
        password:
          type: string
        platformAdministrator:
          type: boolean
        role:
          type: string
        userName:
          type: string
