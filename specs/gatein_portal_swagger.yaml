        membershipType:
          type: string
        userName:
          type: string
    CollectionEntity:
      type: object
      properties:
        empty:
          type: boolean
        entities:
          type: array
          items:
            type: object
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
      additionalProperties:
        type: object
    MembershipTypeImpl:
      type: object
      properties:
        createdDate:
          type: string
          format: date-time
        description:
          type: string
        modifiedDate:
          type: string
          format: date-time
        name:
          type: string
        owner:
          type: string
    UserRestEntity:
      type: object
      properties:
