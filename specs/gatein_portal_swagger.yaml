  /rest/v1/navigations:
    get:
      tags:
        - v1/navigations
      summary: Gets navigations
      description: Gets navigations
      operationId: getSiteNavigation
      parameters:
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: "Limit, if equals to 0, it will use default limit."
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "404":
          description: Navigation does not exist
        "500":
          description: Internal server error
  /rest/v1/navigations/{siteType}:
    get:
      tags:
        - v1/navigations
      summary: Gets navigations of one or multiple site navigations
      description: Gets navigations of one or multiple site navigations
      operationId: getSiteTypeNavigations
      parameters:
        - name: siteType
          in: path
          description: "Portal site type, possible values: PORTAL, GROUP or USER"
          required: true
          schema:
            type: string
        - name: siteName
          in: query
          description: Portal site name
          required: true
          schema:
            type: string
        - name: scope
          in: query
          description: "Scope of navigations tree to retrieve, possible values: ALL, CHILDREN, GRANDCHILDREN, SINGLE"
          schema:
            type: string
            default: ALL
        - name: nodeId
          in: query
          description: parent navigation node id
          schema:
            type: string
        - name: visibility
          in: query
          description: "Multivalued visibilities of navigation nodes to retrieve, possible values: DISPLAYED, HIDDEN, SYSTEM or TEMPORAL. If empty, all visibilities will be used."
          schema:
            type: array
            items:
              type: string
              default: All possible values combined
            default: All possible values combined
        - name: includeGlobal
          in: query
          description: if to include Global site in results in portal type case
          schema:
            type: boolean
            default: true
        - name: expand
          in: query
          description: to include extra node page details in results
          schema:
            type: boolean
        - name: temporalCheck
          in: query
          description: to check the navigation nodes scheduling start and end dates
          schema:
            type: boolean
            default: true
        - name: expandBreadcrumb
          in: query
          description: to expand the navigation breadcrumb
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "404":
          description: Navigation does not exist
        "500":
          description: Internal server error
  /rest/v1/groups:
    get:
      tags:
        - v1/groups
      summary: Gets groups
      description: Gets groups
      operationId: getGroups
      parameters:
        - name: q
          in: query
          description: Search text to filter groups
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
        - name: tree
          in: query
          description: Whether build tree until results or not
          schema:
            type: boolean
            default: false
        - name: returnSize
          in: query
          schema:
            type: boolean
        - name: expand
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: User not authorized to call this endpoint
        "500":
          description: Internal server error
    put:
      tags:
        - v1/groups
      summary: Updates an existing Group
      description: Updates an existing Group
      operationId: updateGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupImpl"
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Bad request
        "401":
          description: User not authorized to call this endpoint
        "500":
          description: Internal server error
    post:
      tags:
        - v1/groups
      summary: Creates a new group
      description: Creates a new group
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupImpl"
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Bad request
        "401":
          description: User not authorized to call this endpoint
        "500":
          description: Internal server error
    delete:
      tags:
        - v1/groups
      summary: Deletes an existing Group
      description: Deletes an existing Group
      operationId: deleteGroup
      parameters:
        - name: groupId
          in: query
          description: Group id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Bad request
        "401":
          description: User not authorized to call this endpoint
        "500":
          description: Internal server error
  /rest/v1/groups/memberships:
