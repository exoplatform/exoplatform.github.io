openapi: 3.0.1
tags:
  - name: /registration/settings
    description: Managing user registraion settings and flow
  - name: /v1/platform/branding
    description: Managing branding information
  - name: v1/navigations
    description: Retrieve sites navigations
  - name: v1/groups
    description: Manages groups operations
  - name: v1/membershipTypes
    description: Manage membership types operations
  - name: v1/users
    description: Manage User operations
paths:
  /rest/registration/settings:
    get:
      tags:
        - /registration/settings
      summary: Get user registraion settings
      description: Get user registraion settings
      operationId: getRegistrationSetting
      responses:
        "200":
          description: Request fulfilled
    put:
      tags:
        - /registration/settings
      summary: Update user registraion settings and flow
      description: Update user registraion settings and flow
      operationId: updateRegistrationSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationSetting"
      responses:
        "204":
          description: Request fulfilled
        "403":
          description: "The session has not been confirmed with a one-time password: OTP_REQUIRED"
  /rest/welcomeScreen/checkUsername:
    get:
      operationId: checkUsername
      parameters:
        - name: username
          in: query
          schema:
            type: string
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /rest/v1/platform/branding/appBackground:
    get:
      tags:
        - /v1/platform/branding
      summary: Get Default application Background image
      description: Get the platform-wide default application background image (Branding and Theme > Pages & Apps style)
      operationId: getAppBackground
      parameters:
        - name: v
          in: query
          description: "The value of version parameter will determine whether the query should be cached by browser or not. If not set, no 'expires HTTP Header will be sent'"
          schema:
            type: string
      responses:
        "200":
          description: Request fullfilled
        "404":
          description: Object not found
  /rest/v1/platform/branding/appTextHeaderBackground:
