          schema:
            type: integer
            format: int32
            default: 20
        - name: returnSize
          in: query
          description: Return total size
          schema:
            type: boolean
      responses:
        "200":
          description: Request fulfilled successfully
        "404":
          description: Parent group not found
        "500":
          description: Internal server error
