            type: string
      requestBody:
        description: Membership object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipImpl"
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Bad request
        "401":
          description: User not authorized to call this endpoint
        "500":
          description: Internal server error
    post:
      tags:
        - v1/groups
      summary: Creates a new membership
      description: Creates a new membership
      operationId: createMembership
      requestBody:
        description: Membership Object
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipImpl"
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Bad request
        "401":
          description: User not authorized to call this endpoint
        "403":
          description: User not allowed to manage the group memberships
        "500":
          description: Internal server error
    delete:
      tags:
        - v1/groups
