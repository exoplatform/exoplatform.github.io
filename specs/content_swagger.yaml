        "500":
          description: Internal server error
      x-operation-name: canScheduleNews
  "/content/rest/contents/list":
    get:
      tags:
        - content/rest/contents
      operationId: NewsRest.getAccessibleNewsByIds
      description: Fetches the list of news articles corresponding to the given list of news IDs
      summary: Get news list
      parameters:
        - name: id
          description: List of news IDs to fetch
          in: query
          required: true
          schema:
            type: array
            items:
