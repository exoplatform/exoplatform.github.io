paths:
  "/content/rest/links/{name}":
    get:
      tags:
        - /content/rest/links
      operationId: LinkRest.getLinkSetting
      description: Retrieves a link application settings with associated links
      summary: Retrieves a link application settings with associated links
      parameters:
        - name: name
          description: Link name
          in: path
          required: true
          schema:
            type: string
        - name: lang
          description: User language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSettingRestEntity"
        "304":
          description: Not modified
        "401":
          description: Unauthorized
        "404":
          description: Resource not found
      x-operation-name: getLinkSetting
    put:
      tags:
        - /content/rest/links
      operationId: LinkRest.saveLinkSetting
      description: Saves a link application settings with associated links
      summary: Saves a link application settings with associated links
      parameters:
        - name: name
          description: Link name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSettingRestEntity"
      responses:
        "200":
          description: Request fulfilled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkSettingRestEntity"
        "401":
          description: Unauthorized
      x-operation-name: saveLinkSetting
  "/content/rest/links/{name}/{id}/icon":
    get:
      tags:
        - /content/rest/links
      operationId: LinkRest.getLinkIcon
      description: Gets a link icon specified by setting name and link id
      summary: Gets a link icon specified by setting name and link id
      parameters:
        - name: name
          description: Link name
          in: path
          required: true
          schema:
            type: string
        - name: id
          description: Link id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Request fulfilled
          content:
            text/plain:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified
        "401":
          description: Unauthorized
        "404":
          description: Resource not found
      x-operation-name: getLinkIcon
  "/content/rest/contents":
    get:
      tags:
        - content/rest/contents
      operationId: NewsRest.getNews
      description: "This gets the list of news with the given search text, of the given author, in the given space or spaces, with the given publication state, with the given pinned state if the authenticated user is a member of the spaces or a super manager."
      summary: Get news list
      parameters:
        - name: author
          description: News author
          in: query
          required: true
          schema:
            type: string
        - name: spaces
          description: News spaces
          in: query
          required: false
          schema:
            type: string
        - name: filter
          description: News filter
          in: query
          required: true
          schema:
            type: string
        - name: text
          description: search text
          in: query
          required: false
          schema:
            type: string
        - name: offset
          description: News pagination offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: limit
          description: News pagination limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: returnSize
          description: News total size
          in: query
          required: false
          schema:
            type: boolean
        - name: expand
          description: expand
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: News list returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsEntity"
        "401":
          description: User not authorized to get the news list
        "404":
          description: News list not found
        "500":
          description: Internal server error
      x-operation-name: getNews
    post:
      tags:
        - content/rest/contents
      operationId: NewsRest.createNews
      description: "This creates the news if the authenticated user is a member of the space or a spaces super manager. The news is created in draft status, unless the publicationState property is set to 'posted'."
      summary: Create a news
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/News"
      responses:
        "200":
          description: News created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/News"
        "400":
          description: Invalid query input
        "401":
          description: User not authorized to create the news
        "500":
          description: Internal server error
      x-operation-name: createNews
  "/content/rest/contents/byActivity/{activityId}":
    get:
