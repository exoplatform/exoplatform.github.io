      parameters:
        - name: spaceId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: User ability to publish a news is returned
          content:
            application/json:
              schema:
                type: boolean
        "401":
          description: User not authorized to publish a news
      x-operation-name: canPublishNews
  "/content/rest/contents/canScheduleNews/{spaceId}":
    get:
      tags:
        - content/rest/contents
      operationId: NewsRest.canScheduleNews
      description: This checks if the current user can schedule a news in the given space
      summary: check if the current user can schedule a news in the given space
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: articleId
          description: target article id
          in: query
          required: true
          schema:
            type: string
        - name: fromExternalPage
          description: is external page to be scheduled
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: User ability to schedule a news
          content:
            application/json:
              schema:
                type: boolean
        "400":
          description: Invalid query input
        "401":
          description: User not authorized to schedule a news
        "404":
