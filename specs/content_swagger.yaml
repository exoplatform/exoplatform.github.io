---
openapi: 3.0.1
info:
  title: Content REST API
  version: 7.3.x-SNAPSHOT
  license:
    name: LGPL
    url: https://www.gnu.org/licenses/lgpl-3.0.en.html
tags:
  - name: /content/rest/links
    description: Managing links for Links Application
  - name: content/rest/contents
    description: Managing contents
