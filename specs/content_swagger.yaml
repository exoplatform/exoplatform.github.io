            application/json:
              schema:
                $ref: "#/components/schemas/NewsEntity"
        "401":
          description: User not authorized to get the news list
        "404":
          description: News list not found
        "500":
          description: Internal server error
      x-operation-name: getNewsByTarget
  "/content/rest/contents/canCreateNews/{spaceId}":
    get:
      tags:
        - content/rest/contents
      operationId: NewsRest.canCreateNews
      description: This checks if the current user can create a news in the given space
      summary: check if the current user can create a news in the given space
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User ability to create a news is returned
          content:
            application/json:
              schema:
                type: boolean
