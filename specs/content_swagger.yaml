          required: true
          schema:
            type: string
        - name: delay
          description: Time to effectively delete news
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: News deleted
          content:
            application/json:
              schema: {}
        "400":
