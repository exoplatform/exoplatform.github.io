          description: Internal server error
      x-operation-name: updateNewsMetadataProperties
  "/content/rest/contents/schedule":
    patch:
      tags:
        - content/rest/contents
      operationId: NewsRest.scheduleNews
      description: "This schedules the news if the authenticated user is a member of the space or a spaces super manager. The news is created in staged status, after reaching a date of publication startPublishedDate, the publicationState property is set to 'posted'."
      summary: Schedule a news
      parameters:
        - name: type
          description: News object type to be fetched
