          in: query
          required: false
          schema:
            type: string
        - name: spaces
          description: Spaces to restrict the content to
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: categoryId
          description: Category id to filter the content by
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: text
          description: Text to search in the content name/summary/content
          in: query
          required: false
          schema:
            type: string
        - name: offset
