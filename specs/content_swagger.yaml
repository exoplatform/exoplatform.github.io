      parameters:
        - name: id
          description: News id
          in: path
          required: true
          schema:
            type: string
        - name: lang
          description: News target lang
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
          content:
            application/json:
              schema: {}
        "401":
