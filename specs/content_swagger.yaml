  "/content/rest/contents/search":
    get:
      tags:
        - content/rest/contents
      operationId: NewsRest.search
      description: Search the list of news available with query
      summary: Search the list of news available with query
      parameters:
        - name: query
          description: Term to search
          in: query
          required: false
          schema:
            type: string
        - name: expand
          description: Properties to expand
          in: query
          required: false
          schema:
            type: string
        - name: offset
          description: Offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: spaceId
          description: Space id used to search news
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: tags
          description: Tag names used to search news
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: limit
          description: Limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: favorites
          description: Favorites
          in: query
          required: false
          schema:
            type: boolean
        - name: sortField
          description: Field to sort by
          in: query
          required: false
          schema:
            type: string
        - name: sortDirection
          description: Sort sortDirection (asc or desc)
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsSearchResultEntity"
