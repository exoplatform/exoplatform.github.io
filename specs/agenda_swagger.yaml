        - /v1/agenda/events
      summary: Retrieves currently authenticated user response to an event
      description: "Retrieves currently authenticated (using token or effectively authenticated) user response to an event. An invited attendee may always read it; on an open event, so may any user who can access it."
      operationId: getEventResponse
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: occurrenceId
          in: query
          description: Event occurrence identifier
          schema:
            type: string
        - name: token
          in: query
          description: 'User token to '
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "403":
          description: "Forbidden operation: not an attendee, and the event isn't open to the caller, or the caller could not be identified from the token"
        "404":
          description: Event not found
        "500":
          description: Internal server error
