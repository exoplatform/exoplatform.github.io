          schema:
            type: boolean
        - name: token
          in: query
          description: User token used to identify user and his response to apply new reponse even when user is not authenticated
          schema:
            type: string
        - name: redirect
          in: query
          description: Whether redirect to Event details after applying new response or not
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: "Request fulfilled: without redirect, the answer stored at the date answered and the first date of a series it left waiting, in JSON; with a redirect, answer acknowledged by an HTML page shown to an external attendee"
        "400":
          description: Invalid query input
        "403":
          description: "Forbidden operation: not an attendee, and the event isn't open to the caller, or the caller could not be identified from the token"
