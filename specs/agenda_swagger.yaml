openapi: 3.0.1
tags:
  - name: /v1/agenda/calendars
    description: Manages agenda calendars associated to users and spaces
  - name: /v1/agenda/events
    description: Manages agenda events associated to users and spaces
  - name: /v1/agenda/settings
    description: Manages agenda settings associated to users
  - name: availability
    description: Reads the busy time of the people a meeting is being scheduled with
  - name: calendar-link
    description: Private read-only iCal links of calendars
  - name: calendar-share
    description: Personal calendars shared with colleagues
  - name: calendar-subscription
    description: Subscriptions to calendar links (iCal / webcal)
  - name: event-attendees
    description: Participant lists of agenda events
  - name: events
    description: Agenda events
paths:
  /rest/v1/agenda/calendars:
    get:
      tags:
        - /v1/agenda/calendars
      summary: Retrieves the list of calendars
      description: "Retrieves the list of calendars available for an owner of type user or space, identitifed by its identity technical identifier. If no designated owner, all calendars available for authenticated user will be retrieved."
      operationId: list
      parameters:
        - name: ownerIds
          in: query
          description: Limit of calendar owner identity ids to incluse in results
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: returnSize
          in: query
          description: Whether return size of results or not
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          description: Offset of result
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit of result
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    put:
      tags:
        - /v1/agenda/calendars
      summary: Updates an existing calendar
      description: Updates an existing calendar
      operationId: updateCalendar
      requestBody:
        description: Calendar object to update
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntity"
        required: true
      responses:
        "204":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "400":
          description: Invalid query input
        "500":
          description: Internal server error
    post:
      tags:
        - /v1/agenda/calendars
      summary: Creates a new calendar
      description: Creates a new calendar
      operationId: createCalendar
      requestBody:
        description: Calendar object to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEntity"
        required: true
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/v1/agenda/calendars/{calendarId}:
    get:
      tags:
        - /v1/agenda/calendars
      summary: Retrieves a calendar identified by its technical identifier
      description: Retrieves a calendar identified by its technical identifier
      operationId: getCalendarById
      parameters:
        - name: calendarId
          in: path
          description: Calendar technical identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    delete:
      tags:
        - /v1/agenda/calendars
      summary: Deletes an existing calendar
      description: Deletes an existing user calendar after moving its events to the owner's default calendar. System (default) calendars can't be deleted.
      operationId: deleteCalendar
      parameters:
        - name: calendarId
          in: path
          description: Calendar technical identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "400":
          description: Invalid query input
        "500":
          description: Internal server error
  /rest/v1/agenda/events:
    get:
      tags:
        - /v1/agenda/events
      summary: Retrieves the list of events available for an owner of type user or space
      description: "Retrieves the list of events available for an owner of type user or space, identitifed by its identity technical identifier. If no designated owner, all events available for authenticated user will be retrieved."
      operationId: getEvents
      parameters:
        - name: ownerIds
          in: query
          description: Identity technical identifiers of calendar owners
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: attendeeIdentityId
          in: query
          description: Attendee identity identifier to filter on events where user is attendee
          required: true
          schema:
            type: integer
            format: int64
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
        - name: start
          in: query
          description: Start datetime using RFC-3339 representation
          required: true
          schema:
            type: string
        - name: end
          in: query
          description: End datetime using RFC-3339 representation
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: limit
          in: query
          description: "Maximum number of events to return. Honoured whenever it is greater than zero, including when an end date is set: the response is then capped at this many events inside the requested period. Omit it, or pass zero, to get every event of the period."
          schema:
            type: integer
            format: int32
            default: 10
        - name: responseTypes
          in: query
          description: Attendee Response statuses to filter events by attendee response
          schema:
            type: array
            items:
              type: string
              enum:
                - NEEDS_ACTION
                - ACCEPTED
                - DECLINED
                - TENTATIVE
                - WAITING
        - name: excludedCalendarIds
          in: query
          description: "Technical identifiers of the calendars whose events must be left out of the results, whatever the selected owners bring in. Every personal calendar of a user shares the user identity as owner, so ownerIds alone cannot express a selection inside them."
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: calendarIds
          in: query
          description: "Technical identifiers of the calendars other users shared with the authenticated user, whose events are wanted on top of the owner selection (EXO-90357). Each is checked against the user; a calendar they may not read refuses the whole request."
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: includeSubscribedCalendars
          in: query
          description: "With an attendee, also reads the calendars subscribed by the owners of this listing (EXO-90373), whatever the response types: their events carry no attendee row. Defaults to false: they are left out."
          schema:
            type: boolean
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    put:
      tags:
        - /v1/agenda/events
      summary: Update an existing event
      description: Update an existing event
      operationId: updateEvent
      parameters:
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: confirmClose
          in: query
          description: Whether the user confirmed that closing the event removes its capacity limit and confirms its waiting list
          schema:
            type: boolean
            default: false
      requestBody:
        description: Event object to update
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventEntity"
        required: true
      responses:
        "204":
          description: Request fulfilled
        "404":
          description: Object not found
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    post:
      tags:
        - /v1/agenda/events
      summary: Create a new event
      description: Create a new event
      operationId: createEvent
      parameters:
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: confirmClose
          in: query
          description: "Whether the user confirmed closing the date of a series saved, while people are waiting for a seat"
          schema:
            type: boolean
            default: false
      requestBody:
        description: Event object to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventEntity"
        required: true
      responses:
        "204":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/v1/agenda/events/{eventId}:
    get:
      tags:
        - /v1/agenda/events
      summary: Retrieves an event identified by its technical identifier
      description: Retrieves an event identified by its technical identifier
      operationId: getEventById
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: firstOccurrence
          in: query
          description: Whether to retrieve first occurrence or not
          schema:
            type: boolean
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    delete:
      tags:
        - /v1/agenda/events
      summary: Delete an existing event or delay deleting an existing event with a fixed period.
      operationId: deleteEvent
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: delay
          in: query
          description: Time to effectively delete event
          schema:
            type: integer
            format: int64
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "404":
          description: Object not found
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    patch:
      tags:
        - /v1/agenda/events
      summary: Update an attribute of an existing event
      description: Update an attribute of an existing event
      operationId: updateEventFields
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: updateAllOccurrences
          in: query
          description: Update all event occurrences or only parent occurrence
          schema:
            type: boolean
            default: false
        - name: sendInvitations
          in: query
          description: Whether notify attendees about the modification or not
          schema:
            type: boolean
            default: false
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: confirmClose
          in: query
          description: Whether the user confirmed that closing the event removes its capacity limit and confirms its waiting list
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Request fulfilled
        "404":
          description: Object not found
        "400":
          description: "Invalid query input: unsupported field, or a value the event's invariants refuse. The body carries the message code; a limit of a series below the Yes answers of one of its dates is answered with an object carrying the code and that date"
        "403":
          description: Forbidden operation
        "500":
          description: Internal server error
  /rest/v1/agenda/events/{eventId}/votes/{dateOptionId}:
    post:
      tags:
