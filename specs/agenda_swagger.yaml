          description: Internal server error
  /rest/v1/agenda/events/{eventId}/exceptionalOccurrences/move:
    post:
      tags:
        - /v1/agenda/events
      summary: Moves the exceptional occurrences of a recurring event dated from a day on under another recurring event
      description: "The second half of a 'this and upcoming' split: the dates the organiser had customised from the split day on move under the series that continues the first one, and are merged into it as a series change merges them — what was customised on a date is kept, what was not follows the new series, a day the new series does not produce is dropped. Called after the continuing series is created and before the first series is shortened"
      operationId: moveEventExceptionalOccurrences
      parameters:
        - name: eventId
          in: path
          description: Technical identifier of the recurring event the rows belong to
          required: true
          schema:
            type: integer
            format: int64
        - name: toEventId
          in: query
          description: Technical identifier of the recurring event they move under
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          description: "First day moved, inclusive, as an RFC 3339 date-time"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Request fulfilled: the identifiers of the rows moved and kept"
        "400":
          description: "Invalid query input: a missing or malformed parameter, two events a split cannot join, or a person from outside the platform the merge would leave on an open date. The body carries the message code"
        "403":
          description: Forbidden operation
        "404":
          description: Object not found
        "500":
          description: Internal server error
  /rest/v1/agenda/events/search:
    get:
      tags:
        - /v1/agenda/events
      summary: Search the list of events available with query for an owner of type user or space
      description: "Search the list of events available with query for an owner of type user or space, identified by its identity technical identifier. If no designated owner, all events available for authenticated user will be retrieved."
      operationId: search
      parameters:
        - name: query
          in: query
          description: Term to search
          required: true
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
        - name: spaceId
          in: query
          description: Space identifier used to search event
          schema:
            type: array
            items:
