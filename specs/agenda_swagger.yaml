              format: int64
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit of results to return
          schema:
            type: integer
            format: int32
        - name: start
          in: query
          description: Start datetime using RFC-3339 representation
          required: true
          schema:
            type: string
        - name: end
          in: query
          description: End datetime using RFC-3339 representation
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "403":
          description: Forbidden operation
        "500":
          description: Internal server error
  /rest/v1/agenda/events/{eventId}/exceptionalOccurrences:
    get:
      tags:
        - /v1/agenda/events
      summary: Retrieves the list of exceptional occurrences of an event
      description: Retrieves the list of exceptional occurrences of an event
      operationId: getEventExceptionalOccurrences
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
  /rest/v1/agenda/events/occurrence/{parentEventId}/{occurrenceId}:
    get:
      tags:
        - /v1/agenda/events
      summary: "Retrieves an occurrence of a recurring event, identified by the parent event identifier and the occurrence date"
      description: "Retrieves an occurrence of a recurring event, identified by the parent event identifier and the occurrence date. The caller must be able to access the occurrence served: a stored exceptional occurrence is checked against its own row (member of the calendar owner, or attendee of that date), a computed occurrence against its series. 403 otherwise."
      operationId: getEventOccurrence
      parameters:
        - name: parentEventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: occurrenceId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: string
        - name: expand
          in: query
          description: Properties to expand
          schema:
            type: string
        - name: timeZoneId
          in: query
          description: IANA Time zone identitifer
          schema:
            type: string
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "403":
          description: "Forbidden operation: the caller can't access the parent event"
        "404":
          description: Event not found
        "500":
          description: Internal server error
  /rest/v1/agenda/events/{eventId}/reminders:
    get:
      tags:
        - /v1/agenda/events
      summary: Retrieve preferred reminders for currently authenticated user for an event
      description: Retrieve preferred reminders for currently authenticated user for an event identified by its technical identifier.
      operationId: getEventRemindersById
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Request fulfilled
        "400":
          description: Invalid query input
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
    put:
      tags:
        - /v1/agenda/events
      summary: Update the list of preferred reminders for authenticated user on a selected event.
      description: Update the list of preferred reminders for authenticated user on a selected event
      operationId: saveEventReminders
      parameters:
        - name: eventId
          in: path
          description: Event technical identifier
          required: true
          schema:
            type: integer
            format: int64
        - name: occurrenceId
          in: query
          description: Event occurrence identifier
          required: true
          schema:
            type: string
        - name: upcoming
          in: query
          description: Whether apply on Event occurrence and its upcoming or not
          required: true
          schema:
            type: boolean
      requestBody:
        description: List of reminders to store on event for currently authenticated user
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EventReminder"
