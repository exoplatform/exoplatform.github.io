  "/agenda/rest/events/attendees/user":
    get:
      tags:
        - event-attendees
      operationId: AgendaEventAttendeeRest.getAttendeeUserByEmail
      description: "Answers the enabled user whose e-mail address it is, looked up as given and in lower case, as the database collation compares, when the platform displays e-mail addresses and that user did not hide theirs; no content otherwise, and always to an external user. Never cached."
      summary: Find the user an e-mail address typed to invite someone belongs to
      parameters:
        - name: email
          description: The e-mail address typed
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The user
        "204":
          description: "No user to invite for that address, or an external caller"
        "400":
          description: No address given
        "503":
          description: "The user directory could not be read: the address was not checked"
      x-operation-name: getAttendeeUserByEmail
  "/agenda/rest/events/{eventId}/attendees/export":
    get:
      tags:
        - event-attendees
      operationId: AgendaEventAttendeeRest.exportEventAttendees
      description: "Answers a CSV file with one row per participant of the date, as the participants drawer lists them: name, email when the platform displays it, and answer. Only someone allowed to update the event may export it, on a confirmed event; never cached."
      summary: Export the participant list of an event as a CSV file
      parameters:
        - name: eventId
          description: Event technical identifier
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: occurrenceId
          description: "Occurrence id of a date of the series, RFC 3339"
          in: query
          required: false
          schema:
            type: string
        - name: timeZoneId
          description: "IANA time zone of the user, dating the file name"
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The CSV file
          content:
            application/json:
              schema: {}
        "400":
          description: "Invalid date or zone, or the event is a date poll"
        "403":
          description: The user may not update the event
        "404":
          description: "Event not found, or the date was cancelled"
      x-operation-name: exportEventAttendees
  "/agenda/rest/events/{eventId}/split":
    post:
      tags:
        - events
      operationId: AgendaEventSplitRest.splitEvent
      description: "Creates the series that continues the recurring event from the date given, with the fields the user edited, in the event's calendar; moves the dates customised from that date on under it; and ends the event the day before. When no date moves, every participant keeps their answers and their places on the waiting list; when one does, every answer but the user's starts over. Everything is written at once, or nothing. Answers the identifier of the continuing series, which the event resource reads."
      summary: "Splits a recurring event at one of its dates: a 'this and upcoming' change"
      parameters:
        - name: eventId
          description: Technical identifier of the recurring event
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: timeZoneId
          description: "IANA time zone identifier the event was read in. A change given in that zone, or in none, keeps the event's own zone, and a weekly rule naming the one weekday, or a monthly or yearly rule naming no weekday and the one day of the month, that its first date falls on in that zone names the one that date falls on in the event's zone; any other rule the change gives keeps the days it names. The dates of a change given in no zone are read in that zone, or in UTC when it is missing"
          in: query
          required: false
          schema:
            type: string
        - name: confirmClose
          description: Whether the user confirmed closing the event while people are waiting for a seat
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSplitEntity"
      responses:
        "200":
          description: "The identifier of the continuing series: {\"id\": <id>}"
          content:
            application/json:
              schema: {}
        "400":
          description: "Invalid input: a date that is not one of the event's after its first, an invalid limit, a limit below the Yes answers of a date, a closing of the event while people wait that is not confirmed, a person from outside the platform on an open continuation or on a date that stays open, or a date or a zone that does not parse. The body carries the message code, and the date for a limit below the Yes answers"
        "403":
          description: The user may not split the event
        "404":
          description: Event not found
        "500":
          description: The split failed; the body carries a fixed message code
      x-operation-name: splitEvent
