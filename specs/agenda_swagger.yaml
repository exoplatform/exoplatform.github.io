              format: int64
        - name: sortField
          in: query
          description: Sort filed
          schema:
            type: string
        - name: sortDirection
          in: query
          description: Sort order (asc or desc)
          schema:
            type: string
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
            format: int32
            default: 0
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Request fulfilled
        "401":
          description: Unauthorized operation
        "500":
          description: Internal server error
